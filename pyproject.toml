[project]
name = "capacity-hunter"
version = "0.1.0"
description = "Hunt for free Oracle Cloud Always-Free Ampere A1 capacity and auto-launch a VM."
requires-python = ">=3.11"
dependencies = [
    "oci>=2.120",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
capacity-hunter = "capacity_hunter.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=capacity_hunter --cov-report=term-missing"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
