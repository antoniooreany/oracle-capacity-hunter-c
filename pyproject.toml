[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-vm-capacity-hunter"
version = "0.1.0"
description = "Oracle Cloud VM capacity hunter with optional auto-launch and DevOps packaging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "oci>=2.168.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "PyYAML>=6.0.2",
  "tenacity>=9.0.0",
  "structlog>=24.2.0",
  "typer>=0.12.3",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.4",
  "mypy>=1.11.1",
  "types-PyYAML>=6.0.12.20240808"
, "streamlit"]
ui = [
  "streamlit>=1.35"
]

[project.scripts]
oci-hunter = "capacity_hunter.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=capacity_hunter --cov-report=term-missing"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
packages = ["capacity_hunter"]



