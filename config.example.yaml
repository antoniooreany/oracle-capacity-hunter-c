# Copy to config.yaml. Values in ${...} are read from environment variables -
# never hardcode secrets or OCIDs directly in this file if you plan to commit it.

oci:
  compartment_id: ${OCI_COMPARTMENT_ID}
  config_file: ~/.oci/config     # standard `oci setup config` location
  config_profile: DEFAULT

# Regions to search, in order. Ampere A1 free-tier capacity is scarcer in
# popular regions - listing several nearby regions increases your odds.
regions:
  - eu-frankfurt-1
  - eu-amsterdam-1
  - eu-milan-1

# Free tier allows up to 4 OCPU / 24 GB total across Ampere A1 instances.
# Splitting into smaller shapes (e.g. 2 OCPU / 12 GB) sometimes succeeds
# faster than requesting the full 4/24 in one shot - list several to try.
shapes:
  - name: VM.Standard.A1.Flex
    ocpus: 4
    memory_in_gbs: 24
  - name: VM.Standard.A1.Flex
    ocpus: 2
    memory_in_gbs: 12

instance:
  display_name: winwin-backend-vm
  image_id: ${OCI_IMAGE_ID}          # ocid of an Ubuntu 22.04 aarch64 image
  subnet_id: ${OCI_SUBNET_ID}        # from your Terraform network.tf output
  ssh_public_key_path: ~/.ssh/id_ed25519.pub
  assign_public_ip: true
  # user_data_path: ./cloud-init.yaml   # optional, base64-encoded and attached as metadata

polling:
  min_interval_seconds: 30
  max_interval_seconds: 300

# "notify": just alert when capacity is found, don't launch anything.
# "create": launch the instance automatically the moment capacity is found.
mode: create

notifications:
  telegram:
    bot_token: ${TELEGRAM_BOT_TOKEN}
    chat_id: ${TELEGRAM_CHAT_ID}
