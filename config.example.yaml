oci:
  config_file: ~/.oci/config
  profile: DEFAULT
  compartment_id: ocid1.compartment.oc1..replace_me
  subnet_id: ocid1.subnet.oc1..replace_me
  ssh_public_key_path: ~/.ssh/id_rsa.pub

search:
  regions:
    - eu-frankfurt-1
    - eu-amsterdam-1
    - eu-milan-1
  shapes:
    - shape: VM.Standard.A1.Flex
      ocpus: 2
      memory_gbs: 12
    - shape: VM.Standard.E2.1.Micro
      ocpus: 1
      memory_gbs: 1
  image_operating_system: Oracle Linux
  image_operating_system_version: "9"
  max_attempts_per_target: 1
  sleep_seconds_between_regions: 2

launch:
  enabled: false
  assign_public_ip: true
  display_name_prefix: capacity-hunter

post_launch:
  env_file_path: .env
  ssh_user: ubuntu
  ssh_private_key_path: ~/.ssh/id_ed25519
  telegram_enabled: false
  telegram_bot_token: ""
  telegram_chat_id: ""
