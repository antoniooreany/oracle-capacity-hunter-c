# Generic example config for Oracle Capacity Hunter.
#
# All secrets are taken from environment variables like ${ENV_VAR}.
# Never commit real OCIDs or tokens.

regions:
  # List of OCI regions to hunt in.
  - eu-milan-1

shapes:
  # Minimal example: one ARM A1 shape.
  - name: VM.Standard.A1.Flex
    ocpus: 1
    memory_in_gbs: 6

mode: notify  # or "create"

min_interval_seconds: 30
max_interval_seconds: 300

instance:
  display_name: oracle-capacity-hunter-a1
  compartment_id: ${OCI_COMPARTMENT_ID}
  image_id: ${OCI_IMAGE_ID}
  subnet_id: ${OCI_SUBNET_ID}
  assign_public_ip: true

  ssh_public_key_path: ${SSH_PUBLIC_KEY_PATH}
  user_data_path: ${USER_DATA_PATH}

oci_config_file: ${OCI_CONFIG_FILE:-$HOME/.oci/config}
oci_config_profile: ${OCI_CONFIG_PROFILE:-DEFAULT}

telegram:
  bot_token: ${TELEGRAM_BOT_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
