# Standard Dependabot configuration generated by dependabot-sync
version: 2
updates:
  # Python packages configuration
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - antoniooreany
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  # GitHub Actions workflows configuration
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - antoniooreany
    open-pull-requests-limit: 3
