name: docs-assistant

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review-pr:
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '[review-pr]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install -e .

      - name: Generate PR docs payload
        id: payload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/code_to_docs.py \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --pr "${{ github.event.issue.number }}" > payload.json

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("payload.json").read_text(encoding="utf-8"))
          required = {"title", "body_md", "labels"}
          missing = required - payload.keys()
          if missing:
              raise SystemExit(f"Missing keys in payload: {sorted(missing)}")
          if not isinstance(payload["labels"], list):
              raise SystemExit("payload['labels'] must be a list")
          Path("title.txt").write_text(payload["title"], encoding="utf-8")
          Path("body.md").write_text(payload["body_md"], encoding="utf-8")
          Path("labels.json").write_text(json.dumps(payload["labels"]), encoding="utf-8")
          PY

      - name: Update pull request title and body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --title-file title.txt \
            --body-file body.md

      - name: Apply labels to pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/labels" \
            --input labels.json
