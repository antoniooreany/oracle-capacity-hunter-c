name: Docs Assistant

on:
  issue_comment:
    types: [created]

jobs:
  review-pr:
    if: >
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, "[review-pr]")
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Generate PR docs payload
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          GH_PR: ${{ github.event.issue.number }}
        run: |
          python -m capacity_hunter.code_to_docs \
            --owner "${GH_OWNER}" \
            --repo "${GH_REPO}" \
            --pr "${GH_PR}" > code_to_docs_payload.json

          echo "Generated payload:"
          cat code_to_docs_payload.json
